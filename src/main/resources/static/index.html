<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Chat Appication</title>
    <link rel="stylesheet" type="text/css" href="main.css">
</head>
<body>
    <div id="chatroom">
        <h1>Chat Application</h1>
        <div id="chat-continaer">
            <div id="user-list">
                <h3>Online Available User</h3>
                <div id="users">User1</div>
                <div id="users">User2</div>
                <div id="users">User3</div>
                <div id="users">User4</div>
            </div>
            <div id="chat-area">
                <div id="chat-area-header">Chat Area</div>
                <div id="messages">
                    <div id="messages-input-area">
                        <div id="message-container">
                            <input type="text" id="message-input" placeholder="Type a message here ...">
                            <button id="send-button" onclick="sendMessage()">Send</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
